name: Guardener production migration fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    # Parser-only fixture: this condition is intentionally impossible so the
    # actions are discovered by Guardener but never execute.
    if: ${{ github.event_name == 'guardener-fixture-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3

      - name: Extract metadata
        uses: docker/metadata-action@v5

      - name: Build and push
        uses: docker/build-push-action@v6
