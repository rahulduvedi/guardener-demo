name: Guardener production migration fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    # Parser-only fixture: this condition is intentionally impossible so the
    # actions are discovered by Guardener but never execute.
    if: ${{ github.event_name == 'guardener-fixture-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: chainguard-actions/actions-checkout@59b7218bfc2eaabc464f1254f6e1dac5bda91d94 # v4

      - name: Set up QEMU
        uses: chainguard-actions/docker-setup-qemu-action@d40f3f46f039b23a2d9d13c16b9aee07ad52e5b2 # v3

      - name: Set up Docker Buildx
        uses: chainguard-actions/docker-setup-buildx-action@6d415f71ab3ef9a7738ade671313ffac4ba9f06c # v3

      - name: Log in to registry
        uses: chainguard-actions/docker-login-action@471f865b6525577aec1a207ce43d4ec3ed8a996d # v4.6.0

      - name: Extract metadata
        uses: chainguard-actions/docker-metadata-action@897c7d20d500ba5c444ff537bcce1278724b6c96 # v6.2.0

      - name: Build and push
        uses: chainguard-actions/docker-build-push-action@90e59df237ac4b0e77911df31d377167fc308506 # v6
